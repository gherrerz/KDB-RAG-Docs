replicaCount: 1
epm: BKKG
service:
  port: 8000

appContext: /

health:
  http:
    path: /health
  liveness:
    failureThreshold: 60

#depdendencyCheck:
#  - passsport
#  - db_appeal

resources:
  limits:
    cpu: 4000m
    memory: 4096Mi
  requests:
    cpu: 500m
    memory: 1024Mi

secrets:
#  - name: OPENAI_API_KEY:
#  - name: GEMINI_API_KEY:
  - name: VERTEX_SERVICE_ACCOUNT_JSON_B64
  - name: NEO4J_USER
  - name: NEO4J_PASSWORD
  - name: CHROMA_USERNAME
  - name: CHROMA_PASSWORD
  - name: POSTGRES_USER
  - name: POSTGRES_PASSWORD

vault:
  enabled: false

trafficControl:
  enabled: true
  egress:
    services:
      - copilot.external.svc
      - copilotapi.external.svc
      - jira-cl.external.svc.cluster.local
      - jenkins-dev.external.svc
      - bitbucket-cl.external.svc

ingress:
  enabled: true
  internet_facing:
    enabled: false
  pathPrefix: /
  cors:
    envsAllowedOrigins:
      prd: "*"
      uat: "*"
      ist: "*"
      dev: "*"

extraEnv:
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  LLM_PROVIDER: "vertex"
  LLM_EMBEDDING: "text-embedding-005"
  VERTEX_LOCATION: "us-central1"
  DATA_DIR: "/app/storage"
  RUNTIME_ENVIRONMENT: "development"
  USE_NEO4J: "false"
  NEO4J_URI: "neo4j://neo4j-operator.neo4j-operator.svc:7687"
  NEO4J_URI_PROD: "neo4j://neo4j-operator.neo4j-operator.svc:7687"
  NEO4J_URI_DEV: "neo4j://neo4j-operator.neo4j-operator.svc:7687"
  NEO4J_URI_TEST: "neo4j://neo4j-operator.neo4j-operator.svc:7687"
  USE_CHROMA: "true"
  CHROMA_MODE: "remote"
  CHROMA_HOST: "chromadb-operator.chromadb-operator.svc"
  CHROMA_HOST_PROD: "chromadb-operator.chromadb-operator.svc"
  CHROMA_HOST_DEV: "chromadb-operator.chromadb-operator.svc"
  CHROMA_HOST_TEST: "chromadb-operator.chromadb-operator.svc"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "coderag_chunks"
  POSTGRES_HOST: "coipo-postgres.coipo.svc"
  POSTGRES_HOST_PROD: "coipo-postgres.coipo.svc"
  POSTGRES_HOST_DEV: "coipo-postgres.coipo.svc"
  POSTGRES_HOST_TEST: "coipo-postgres.coipo.svc"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "coipo_db"
  USE_RQ: "false"
  REDIS_URL: "redis://localhost:6379/0"
  